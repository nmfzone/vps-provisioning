letsencrypt_webroot: /var/www/letsencrypt
ssh_port: 22
omniroute_user: omniroute
omniroute_group: omniroute
omniroute_data_dir: /var/lib/omniroute
omniroute_config_dir: /etc/omniroute
omniroute_port: 20128
omniroute_package_name: omniroute
omniroute_package_version: "3.8.49"
omniroute_package: "{{ omniroute_package_name }}@{{ omniroute_package_version }}"
omniroute_npm_prefix: "{{ omniroute_data_dir }}/npm"
omniroute_npm_cache_dir: "{{ omniroute_data_dir }}/.cache/npm"
omniroute_executable: "{{ omniroute_npm_prefix }}/bin/omniroute"
nodejs_major_version: 24
omniroute_memory_mb: 2048
admin_shell: /bin/bash
enable_oh_my_zsh: true
oh_my_zsh_repo: https://github.com/ohmyzsh/ohmyzsh.git
oh_my_zsh_repo_revision: 146461f7c6d95f4ba1220559d66eb113418b40a8
backup_repo_dir: /var/backups/omniroute-git
backup_script_path: /usr/local/libexec/omniroute-backup
backup_known_hosts_file: /root/.ssh/omniroute-backup_known_hosts
backup_deploy_key_path: /root/.ssh/omniroute-backup
backup_snapshot_source: "{{ omniroute_data_dir }}/db_backups"
backup_target_file: omniroute-backup.sqlite
backup_schedule: "*-*-* 03:00:00"
backup_rewrite_day: 1