- name: Create OmniRoute group
  ansible.builtin.group:
    name: "{{ omniroute_group }}"
    system: true

- name: Create OmniRoute user
  ansible.builtin.user:
    name: "{{ omniroute_user }}"
    group: "{{ omniroute_group }}"
    system: true
    shell: /usr/sbin/nologin
    home: "{{ omniroute_data_dir }}"

- name: Create OmniRoute directories
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: "{{ item.owner }}"
    group: "{{ item.group }}"
    mode: "{{ item.mode }}"
  loop:
    - {path: '{{ omniroute_data_dir }}', owner: '{{ omniroute_user }}', group: '{{ omniroute_group }}', mode: '0750'}
    - {path: '{{ omniroute_config_dir }}', owner: 'root', group: '{{ omniroute_group }}', mode: '0750'}
    - {path: '/var/log/omniroute', owner: '{{ omniroute_user }}', group: '{{ omniroute_group }}', mode: '0750'}
    - {path: '{{ omniroute_data_dir }}/.cache', owner: '{{ omniroute_user }}', group: '{{ omniroute_group }}', mode: '0700'}
    - {path: '{{ omniroute_npm_cache_dir }}', owner: '{{ omniroute_user }}', group: '{{ omniroute_group }}', mode: '0700'}
    - {path: '{{ omniroute_npm_prefix }}', owner: '{{ omniroute_user }}', group: '{{ omniroute_group }}', mode: '0750'}
    - {path: '{{ omniroute_data_dir }}/.ansible/tmp', owner: '{{ omniroute_user }}', group: '{{ omniroute_group }}', mode: '0700'}

- name: Check installed OmniRoute package version
  ansible.builtin.command:
    argv:
      - /usr/bin/node
      - -p
      - "require('{{ omniroute_npm_prefix }}/lib/node_modules/{{ omniroute_package_name }}/package.json').version"
  register: omniroute_installed_version
  changed_when: false
  failed_when: false
  check_mode: false

- name: Install pinned OmniRoute npm package
  ansible.builtin.command:
    argv:
      - /usr/bin/npm
      - install
      - --global
      - "--prefix={{ omniroute_npm_prefix }}"
      - --save-exact
      - --no-audit
      - --no-fund
      - "{{ omniroute_package }}"
  environment:
    HOME: "{{ omniroute_data_dir }}"
    npm_config_cache: "{{ omniroute_npm_cache_dir }}"
    npm_config_registry: https://registry.npmjs.org
    npm_config_update_notifier: "false"
    npm_config_engine_strict: "true"
  become_user: "{{ omniroute_user }}"
  register: omniroute_npm_install
  changed_when: omniroute_npm_install.rc == 0
  retries: 3
  delay: 20
  until: omniroute_npm_install.rc == 0
  notify: Reload OmniRoute supervisor
  when:
    - omniroute_installed_version.rc != 0 or omniroute_installed_version.stdout | trim != omniroute_package_version
    - not ansible_check_mode

- name: Report pinned OmniRoute npm installation in check mode
  ansible.builtin.debug:
    msg: "Would install {{ omniroute_package }} into {{ omniroute_npm_prefix }} as {{ omniroute_user }}"
  changed_when: true
  when:
    - ansible_check_mode
    - omniroute_installed_version.rc != 0 or omniroute_installed_version.stdout | trim != omniroute_package_version

- name: Validate pinned OmniRoute CLI
  ansible.builtin.command:
    argv:
      - "{{ omniroute_executable }}"
      - --version
  environment:
    HOME: "{{ omniroute_data_dir }}"
    XDG_CACHE_HOME: "{{ omniroute_data_dir }}/.cache"
  become_user: "{{ omniroute_user }}"
  register: omniroute_cli_version
  changed_when: false
  failed_when: omniroute_cli_version.rc != 0 or omniroute_package_version not in omniroute_cli_version.stdout
  when:
    - not ansible_check_mode or (omniroute_installed_version.rc == 0 and omniroute_installed_version.stdout | trim == omniroute_package_version)
    - omniroute_installed_version.rc == 0 or omniroute_npm_install is changed

- name: Install OmniRoute environment
  ansible.builtin.template:
    src: omniroute.env.j2
    dest: "{{ omniroute_config_dir }}/omniroute.env"
    owner: root
    group: "{{ omniroute_group }}"
    mode: '0640'
  no_log: true
  notify: Reload OmniRoute supervisor

- name: Ensure local executable directory exists
  ansible.builtin.file:
    path: /usr/local/libexec
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: Install secret-loading OmniRoute wrapper
  ansible.builtin.template:
    src: omniroute-start.j2
    dest: /usr/local/libexec/omniroute-start
    owner: root
    group: "{{ omniroute_group }}"
    mode: '0750'
  no_log: true
  notify: Reload OmniRoute supervisor

- name: Render Supervisor configuration
  ansible.builtin.template:
    src: omniroute.conf.j2
    dest: /etc/supervisor/conf.d/omniroute.conf
    owner: root
    group: root
    mode: '0644'
  notify: Reload OmniRoute supervisor

- name: Ensure Supervisor is enabled
  ansible.builtin.service:
    name: supervisor
    state: started
    enabled: true
  when: not ansible_check_mode

- name: Enable omniroute autobackup
  ansible.builtin.command:
    argv:
      - "{{ omniroute_executable }}"
      - backup
      - auto
      - enable
      - --cron
      - "0 2 * * *"
      - --retention
      - 7
  when: not ansible_check_mode