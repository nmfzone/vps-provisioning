---
- name: Check existing Node.js installation
  ansible.builtin.command: /usr/bin/node --version
  register: existing_nodejs
  changed_when: false
  failed_when: false
  check_mode: false

- name: Install NodeSource repository prerequisites
  ansible.builtin.apt:
    name:
      - ca-certificates
      - gnupg
    state: present
    update_cache: true

- name: Ensure APT keyring directory exists
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: Install NodeSource repository signing key
  ansible.builtin.get_url:
    url: https://deb.nodesource.com/gpgkey/nodesource-repo.gpg.key
    dest: /etc/apt/keyrings/nodesource.asc
    owner: root
    group: root
    mode: '0644'

- name: Configure signed NodeSource Node.js 24 repository
  ansible.builtin.copy:
    dest: /etc/apt/sources.list.d/nodesource.sources
    owner: root
    group: root
    mode: '0644'
    content: |
      Types: deb
      URIs: https://deb.nodesource.com/node_{{ nodejs_major_version }}.x/
      Suites: nodistro
      Components: main
      Architectures: {{ {'x86_64': 'amd64', 'aarch64': 'arm64'}[ansible_facts['architecture']] }}
      Signed-By: /etc/apt/keyrings/nodesource.asc
  register: nodesource_repository

- name: Install Node.js 24
  ansible.builtin.apt:
    name: nodejs
    state: present
    update_cache: "{{ nodesource_repository.changed }}"

- name: Validate supported Node.js version
  ansible.builtin.command: /usr/bin/node --version
  register: nodejs_check
  changed_when: false
  failed_when: >-
    nodejs_check.rc != 0 or
    (nodejs_check.stdout | trim | regex_replace('^v', '')).split('.')[0] | int != nodejs_major_version | int
  when: not ansible_check_mode or existing_nodejs.rc == 0
