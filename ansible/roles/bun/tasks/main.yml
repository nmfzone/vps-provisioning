- name: Select Bun release artifact
  ansible.builtin.set_fact:
    bun_release_arch: "{{ {'x86_64': 'x64', 'aarch64': 'aarch64'}[ansible_facts['architecture']] }}"
    bun_archive_dir: "/tmp/bun-{{ bun_version }}-{{ ansible_facts['architecture'] }}"

- name: Check existing Bun installation
  ansible.builtin.command: "{{ bun_install_dir }}/bun --version"
  register: existing_bun
  changed_when: false
  failed_when: false
  check_mode: false

- name: Create versioned Bun extraction directory
  ansible.builtin.file:
    path: "{{ bun_archive_dir }}"
    state: directory
    owner: root
    group: root
    mode: '0755'
  when:
    - existing_bun.stdout | trim != bun_version | string
    - not ansible_check_mode

- name: Download Bun release
  ansible.builtin.get_url:
    url: "https://github.com/oven-sh/bun/releases/download/bun-v{{ bun_version }}/bun-linux-{{ bun_release_arch }}.zip"
    dest: "{{ bun_archive_dir }}/bun.zip"
    mode: '0644'
  when:
    - existing_bun.stdout | trim != bun_version | string
    - not ansible_check_mode

- name: Extract Bun release
  ansible.builtin.unarchive:
    src: "{{ bun_archive_dir }}/bun.zip"
    dest: "{{ bun_archive_dir }}"
    remote_src: true
    creates: "{{ bun_archive_dir }}/bun-linux-{{ bun_release_arch }}/bun"
  when:
    - existing_bun.stdout | trim != bun_version | string
    - not ansible_check_mode

- name: Install Bun executable
  ansible.builtin.copy:
    src: "{{ bun_archive_dir }}/bun-linux-{{ bun_release_arch }}/bun"
    dest: "{{ bun_install_dir }}/bun"
    remote_src: true
    owner: root
    group: root
    mode: '0755'
  when:
    - existing_bun.stdout | trim != bun_version | string
    - not ansible_check_mode

- name: Install Bunx compatibility symlink
  ansible.builtin.file:
    src: "{{ bun_install_dir }}/bun"
    dest: "{{ bun_install_dir }}/bunx"
    state: link
    force: true
  when: not ansible_check_mode or existing_bun.rc == 0

- name: Validate Bun
  ansible.builtin.command: "{{ bun_install_dir }}/bun --version"
  register: bun_check
  changed_when: false
  failed_when: bun_check.rc != 0 or bun_check.stdout | trim != bun_version | string
  when: not ansible_check_mode or existing_bun.rc == 0
